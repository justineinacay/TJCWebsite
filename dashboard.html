}

/* ── OVERVIEW ────────────────────────────────────────────────────────── */
function OverviewPanel({ senior, session }) {
  useTicker(15000);
  const meds = senior.medications||[];
  const done = meds.filter(m=>m.status==="done").length;
  const missed = meds.filter(m=>m.status==="missed").length;
  const medPct = meds.length ? Math.round((done/meds.length)*100) : 0;
  const isSOS = senior.status==="sos";
  const EVENT_COLOR = { checkin:"var(--green)", sos:"var(--red)", fall:"var(--red)", med_taken:"var(--green)", med_missed:"var(--gold)", med_snoozed:"var(--gold)", gps:"var(--gold)", notif:"var(--ink2)" };
  const EVENT_BG = { checkin:"rgba(26,140,74,0.1)", sos:"rgba(196,48,30,0.1)", fall:"rgba(196,48,30,0.1)", med_taken:"rgba(26,140,74,0.1)", med_missed:"rgba(192,112,16,0.1)", med_snoozed:"rgba(192,112,16,0.1)", gps:"rgba(192,112,16,0.1)", notif:"var(--cream2)" };

  // Personalized, time-of-day-aware greeting — Philippine local time regardless of viewer's own timezone.
  // The sub-line rotates through a small pool instead of one static sentence — picked deterministically
  // from the PH calendar day + senior id, so it feels alive across visits but never flickers mid-session
  // (this component re-renders every 15s via useTicker).
  const phDate = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Manila"}));
  const phHour = phDate.getHours();
  const greetWord = phHour<12 ? "Magandang umaga" : phHour<18 ? "Magandang hapon" : "Magandang gabi";
  const greetEmoji = phHour<12 ? "🌅" : phHour<18 ? "☀️" : "🌙";
  const emailName = session?.user?.email ? session.user.email.split("@")[0].replace(/[._-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()) : null;
  const nm = senior.nickname||senior.name;
  const NORMAL_SUBS = [
    `Narito ang buod ng pag-aalaga kay ${nm} ngayong araw.`,
    `Kumusta kaya si ${nm} ngayon? Tignan natin.`,
    `Isang tingin lang, alam mo na kung ayos si ${nm}.`,
    `${nm} muna bago lahat — heto ang latest.`,
    `Malapit ka kay ${nm} kahit malayo — ito ang update.`,
    `Ilang segundo lang, updated ka na tungkol kay ${nm}.`,
  ];
  const NUDGE_SUBS = [
    `Medyo tahimik pa ngayong araw — siguraduhin lang na ayos si ${nm}.`,
    `Wala pang check-in si ${nm} — isang tawag o mensahe ay malaking tulong.`,
    `Bago ka pumunta sa araw mo, siguraduhin munang ayos si ${nm}.`,
  ];
  const daySeed = Array.from(phDate.toDateString()+senior.id).reduce((a,c)=>a+c.charCodeAt(0),0);
  const greetSub = isSOS
    ? `🚨 Kailangan ni ${nm} ng agarang tulong ngayon — buksan ang SOS alert sa ibaba.`
    : (senior.checkedIn ? NORMAL_SUBS : NUDGE_SUBS)[daySeed % (senior.checkedIn ? NORMAL_SUBS.length : NUDGE_SUBS.length)];

  // Fills the reclaimed desktop width with real content instead of empty space:
  // upcoming calendar events + a compact vitals snapshot, both genuinely useful.
  const now = new Date(); now.setHours(0,0,0,0); // start of today, so today's own events aren't excluded once the clock moves past midnight
  const upcoming = occurrencesInRange(senior, now, addDays(now,14)).filter(o=>!o.event.isMed).slice(0,5);
  const vitals = senior.vitals||[];
  const lastBP = vitals.find(v=>v.type==="bp"), lastWeight = vitals.find(v=>v.type==="weight"), lastOxygen = vitals.find(v=>v.type==="oxygen");

  return (
    <>
      {emailName && (
        <div className="greeting-bar">
          <span className="greeting-wave">{isSOS ? "🚨" : greetEmoji}</span>
          <div>
            <div className="greeting-text">{greetWord}, {emailName}!</div>
            <div className="greeting-sub">{greetSub}</div>
          </div>
        </div>
      )}
      <div className="overview-shell">
      <div className="overview-main">
        {/* Hero identity card — mirrors the senior's own phone, so this feels like a real person, not a database row */}
        <div className="hero-id-card" style={isSOS?{background:"var(--red)"}:{}}>
          <div className="hero-id-avatar">
            {(senior.nickname||senior.name||"?")[0]}
            <span className="hero-id-pulse" style={{background:isSOS?"#fff":"var(--green-bright)"}}></span>
          </div>
          <div className="hero-id-body">
            <div className="hero-id-name">{senior.name}</div>
            <div className="hero-id-status">{isSOS?"SOS Active — kailangan ng agarang tulong":senior.checkedIn?`Ayos naman · huling check-in ${timeAgo(senior.lastCheckin)}`:"Wala pang check-in ngayong araw"}</div>
          </div>
          <div className="hero-id-battery">
            <Icon name="battery" size={15} color="rgba(255,255,255,0.85)"/>{senior.battery}%
          </div>
        </div>

        <div className="stat-grid">
          <div className="stat-card">
            <div className="ic" style={{background:"rgba(26,140,74,0.09)",color:"var(--green)"}}><Icon name="checkmark" size={18}/></div>
            <div className="val">{senior.checkedIn?"Ayos":"Wala pa"}</div>
            <div className="lbl">{senior.checkedIn?timeAgo(senior.lastCheckin):"Huling Check-in"}</div>
          </div>
          <div className="stat-card">
            <div className="ic" style={{background:missed>0?"rgba(192,112,16,0.09)":"rgba(192,112,16,0.09)",color:missed>0?"var(--gold)":"var(--gold)"}}><Icon name="pill" size={18}/></div>
            <div className="val"><CountUp value={done}/>/{meds.length}</div>
            <div className="lbl">Gamot Ngayon</div>
            {meds.length>0 && <div className="stat-bar"><div className="stat-bar-fill" style={{width:medPct+"%",background:missed>0?"var(--accent)":"var(--green)"}}></div></div>}
          </div>
          <div className="stat-card">
            <div className="ic" style={{background:senior.battery<20?"rgba(192,112,16,0.09)":"var(--cream2)",color:senior.battery<20?"var(--gold)":"var(--ink2)"}}><Icon name="battery" size={18}/></div>
            <div className="val"><CountUp value={senior.battery} suffix="%"/></div>
            <div className="lbl">Baterya ng Telepono</div>
          </div>
          <div className="stat-card">
            <div className="ic" style={{background:"rgba(192,112,16,0.09)",color:"var(--gold)"}}><Icon name="phone" size={18}/></div>
            <div className="val"><CountUp value={(senior.contacts||[]).length}/></div>
            <div className="lbl">Emergency Contacts</div>
          </div>
        </div>
        <InsightsPanel senior={senior}/>
        <div className="panel">
          <div className="panel-head"><h2><Icon name="activity" size={17}/>Pinakabagong Aktibidad</h2></div>
          {(senior.eventLog||[]).length===0 ? (
            <div className="empty-state"><Icon name="activity" size={36}/><p>Wala pang aktibidad.</p></div>
          ) : (senior.eventLog||[]).slice(0,8).map(ev=>(
            <div className="row-item" key={ev.id}>
              <div className="row-avatar" style={{background:EVENT_BG[ev.type]||"var(--cream2)",color:EVENT_COLOR[ev.type]||"var(--ink2)"}}><Icon name={ev.icon||"activity"} size={16}/></div>
              <div className="row-body"><div className="t1">{ev.title}</div><div className="t2">{timeAgo(ev.time)}{ev.detail?" · "+ev.detail:""}</div></div>
            </div>
          ))}
        </div>
      </div>

      <div className="overview-side">
        <CareStatusDonut senior={senior}/>
        <div className="panel">
          <div className="panel-head"><h2><Icon name="clock" size={17}/>Paparating</h2></div>
          {upcoming.length===0 ? (
            <div className="empty-state small"><Icon name="clock" size={28}/><p>Walang naka-schedule sa susunod na 2 linggo.</p></div>
          ) : upcoming.map((o,idx)=>(
            <div className="row-item" key={idx}>
              <div className="row-avatar" style={{background:EVENT_TYPES[o.event.type]?.bg,color:EVENT_TYPES[o.event.type]?.color}}><Icon name="clock" size={14}/></div>
              <div className="row-body"><div className="t1">{o.event.title}</div><div className="t2">{o.date.toLocaleDateString('en-PH',{month:'short',day:'numeric'})}{o.event.time?" · "+o.event.time:""}</div></div>
            </div>
          ))}
        </div>
        <div className="panel">
          <div className="panel-head"><h2><Icon name="heart_pulse" size={17}/>Huling Vitals</h2></div>
          {!lastBP && !lastWeight && !lastOxygen ? (
            <div className="empty-state small"><Icon name="heart_pulse" size={28}/><p>Wala pang naka-log.</p></div>
          ) : (
            <div className="vitals-snapshot">
              {lastBP && <div className="vs-row"><span>BP</span><strong>{lastBP.value} <em>mmHg</em></strong></div>}
              {lastWeight && <div className="vs-row"><span>Timbang</span><strong>{lastWeight.value} <em>kg</em></strong></div>}
              {lastOxygen && <div className="vs-row"><span>Oxygen</span><strong>{lastOxygen.value} <em>%</em></strong></div>}
            </div>
          )}
        </div>
      </div>
    </div>
    </>
  );
}

/* ── MEDICATIONS ─────────────────────────────────────────────────────── */
const MED_ROUTES = { oral:"Oral", topical:"Topical", injection:"Injection", inhaler:"Inhaler", drops:"Drops", patch:"Patch", other:"Iba pa" };

function MedsPanel({ senior, patch }) {
  const [form, setForm] = useState(null);
  const [justDone, setJustDone] = useState(null);
  const meds = senior.medications||[];
  const del = (id) => patch(s=>({...s, medications:(s.medications||[]).filter(m=>m.id!==id)}));
  const markDone = (id) => {
    setJustDone(id); setTimeout(()=>setJustDone(null), 900);
    patch(s=>({...s, medications:(s.medications||[]).map(m=>{
      if(m.id!==id) return m;
      const next = {...m, status:"done", taken:true};
      if(typeof m.refillCount==="number") next.refillCount = Math.max(0, m.refillCount-1);
      return next;
    })}));
  };
  const statusColor = { done:"var(--green)", pending:"var(--gold)", upcoming:"var(--ink3)", missed:"var(--accent)" };
  const statusBg = { done:"rgba(26,140,74,0.1)", pending:"rgba(192,112,16,0.1)", upcoming:"var(--cream2)", missed:"rgba(192,112,16,0.1)" };
  const statusLabel = { done:"Nainom", pending:"Naghihintay", upcoming:"Mamaya", missed:"Nalaktawan" };
  const doneCount = meds.filter(m=>m.status==="done").length;
  const missedCount = meds.filter(m=>m.status==="missed").length;
  const adherence = meds.length ? Math.round((doneCount/meds.length)*100) : null;
  const nextDose = meds.filter(m=>m.status==="pending"&&!m.prn).sort((a,b)=>(a.schedule?.[0]||"").localeCompare(b.schedule?.[0]||""))[0];
  const lowRefills = meds.filter(m=>typeof m.refillCount==="number" && typeof m.refillThreshold==="number" && m.refillCount<=m.refillThreshold);

  const openNew = () => setForm({ name:"",dose:"",route:"oral",schedule:"08:00",freq:"1x",prn:false,daysOfWeek:[],startDate:"",endDate:"",instructions:"",prescribedBy:"",refillCount:"",refillThreshold:"" });
  const openEdit = (m) => setForm({...m, schedule:(m.schedule||[]).join(", "), daysOfWeek:m.daysOfWeek||[]});
  const toggleDay = (d) => setForm(x => ({...x, daysOfWeek: x.daysOfWeek.includes(d) ? x.daysOfWeek.filter(v=>v!==d) : [...x.daysOfWeek,d].sort()}));
  const saveForm = () => {
    if(!form.name) return;
    const rec = {
      ...form,
      schedule: form.prn ? [] : form.schedule.split(",").map(s=>s.trim()).filter(Boolean),
      refillCount: form.refillCount===""?undefined:Number(form.refillCount),
      refillThreshold: form.refillThreshold===""?undefined:Number(form.refillThreshold),
    };
    patch(s=>{
      const list = s.medications||[];
      if(form.id) s.medications = list.map(m=>m.id===form.id?{...m,...rec}:m);
      else s.medications = [...list, {...rec, id:nid(), status:"pending"}];
      return s;
    });
    setForm(null);
  };

  return (
    <>
      {meds.length>0 && (
        <div className="stat-grid">
          <div className="stat-card">
            <div className="ic" style={{background:missedCount>0?"rgba(192,112,16,0.09)":"rgba(26,140,74,0.09)",color:missedCount>0?"var(--gold)":"var(--green)"}}><Icon name="checkmark" size={18}/></div>
            <div className="val"><CountUp value={adherence} suffix="%"/></div>
            <div className="lbl">Adherence Ngayon</div>
            <div className="stat-bar"><div className="stat-bar-fill" style={{width:adherence+"%",background:missedCount>0?"var(--accent)":"var(--green)"}}></div></div>
          </div>
          <div className="stat-card">
            <div className="ic" style={{background:"rgba(192,112,16,0.09)",color:"var(--gold)"}}><Icon name="clock" size={18}/></div>
            <div className="val">{nextDose?nextDose.schedule?.[0]||"—":"Wala"}</div>
            <div className="lbl">{nextDose?nextDose.name:"Susunod na Dosis"}</div>
          </div>
          <div className="stat-card">
            <div className="ic" style={{background:"rgba(26,140,74,0.09)",color:"var(--green)"}}><Icon name="pill" size={18}/></div>
            <div className="val"><CountUp value={doneCount}/>/{meds.length}</div>
            <div className="lbl">Nainom Ngayong Araw</div>
          </div>
          <div className="stat-card">
            <div className="ic" style={{background:missedCount>0?"rgba(192,112,16,0.09)":"var(--cream2)",color:missedCount>0?"var(--gold)":"var(--ink3)"}}><Icon name="alert_tri" size={18}/></div>
            <div className="val"><CountUp value={missedCount}/></div>
            <div className="lbl">Nalaktawan</div>
          </div>
        </div>
      )}
      {lowRefills.length>0 && (
        <div style={{background:"rgba(192,112,16,0.08)",border:"1.5px solid rgba(192,112,16,0.25)",borderRadius:16,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
          <Icon name="alert_tri" size={18} color="var(--gold)"/>
          <div style={{fontSize:12.5,fontWeight:700,color:"var(--gold)"}}>Paubos na: {lowRefills.map(m=>`${m.name} (${m.refillCount} na lang)`).join(", ")}</div>
        </div>
      )}
      <div className="panel">
      <div className="panel-head">
        <div><h2><Icon name="pill" size={17}/>Gamot ni {senior.nickname||senior.name}</h2><p>{meds.length} na gamot naka-schedule</p></div>
        <button className="btn-add" onClick={openNew}><Icon name="plus" size={14}/>Magdagdag</button>
      </div>
      {form && (
        <div style={{background:"var(--cream2)",borderRadius:16,padding:18,marginBottom:18}}>
          <div className="form-row">
            <div className="form-field"><label>Pangalan ng Gamot</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Amlodipine"/></div>
            <div className="form-field"><label>Dosage</label><input value={form.dose} onChange={e=>setForm({...form,dose:e.target.value})} placeholder="5mg"/></div>
          </div>
          <div className="form-row">
            <div className="form-field"><label>Route</label><select value={form.route||"oral"} onChange={e=>setForm({...form,route:e.target.value})}>{Object.entries(MED_ROUTES).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div>
            <div className="form-field"><label>Inireseta ni (opsyonal)</label><input value={form.prescribedBy||""} onChange={e=>setForm({...form,prescribedBy:e.target.value})} placeholder={senior.medicalProfile?.doctorName||"Dr. Santos"}/></div>
          </div>

          <div className="toggle-row" style={{padding:"6px 0 14px",border:"none"}}>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:"var(--ink)"}}>Kapag kinakailangan lang (PRN)</div>
              <div style={{fontSize:11,color:"var(--ink3)",fontWeight:600,marginTop:2}}>Walang fixed na oras — hal. pampakalma ng sakit</div>
            </div>
            <button type="button" className={"toggle"+(form.prn?" on":"")} onClick={()=>setForm({...form,prn:!form.prn})} style={{background:form.prn?"var(--accent)":"var(--card-border)"}}><span className="knob"></span></button>
          </div>

          {!form.prn && (
            <div className="form-row">
              <div className="form-field"><label>Oras (24h, comma-separated)</label><input value={form.schedule} onChange={e=>setForm({...form,schedule:e.target.value})} placeholder="08:00, 20:00"/></div>
              <div className="form-field"><label>Dalas</label><select value={form.freq} onChange={e=>setForm({...form,freq:e.target.value})}><option value="1x">1x isang araw</option><option value="2x">2x isang araw</option><option value="3x">3x isang araw</option></select></div>
            </div>
          )}

          {!form.prn && (
            <div className="form-field" style={{marginBottom:12}}>
              <label>Mga araw (blangko = araw-araw)</label>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {DOW_SHORT_TL.map((d,idx)=>(
                  <button key={idx} type="button" onClick={()=>toggleDay(idx)}
                    style={{width:40,height:34,borderRadius:9,border:`1.5px solid ${form.daysOfWeek.includes(idx)?"var(--accent)":"var(--card-border)"}`,background:form.daysOfWeek.includes(idx)?"var(--accent)":"var(--card-bg)",color:form.daysOfWeek.includes(idx)?"#fff":"var(--ink2)",fontSize:11,fontWeight:800,cursor:"pointer"}}>{d}</button>
                ))}
              </div>
            </div>
          )}

          <div className="form-row">
            <div className="form-field"><label>Simula (opsyonal)</label><input type="date" value={form.startDate||""} onChange={e=>setForm({...form,startDate:e.target.value})}/></div>
            <div className="form-field"><label>Hanggang (opsyonal — para sa antibiotics atbp.)</label><input type="date" value={form.endDate||""} onChange={e=>setForm({...form,endDate:e.target.value})}/></div>
          </div>

          <div className="form-row">
            <div className="form-field"><label>Bilang na natitira (opsyonal)</label><input type="number" value={form.refillCount} onChange={e=>setForm({...form,refillCount:e.target.value})} placeholder="30"/></div>
            <div className="form-field"><label>Alertuhan kapag umabot sa (opsyonal)</label><input type="number" value={form.refillThreshold} onChange={e=>setForm({...form,refillThreshold:e.target.value})} placeholder="5"/></div>
          </div>

          <div className="form-field" style={{marginBottom:14}}>
            <label>Mga tagubilin (opsyonal)</label>
            <input value={form.instructions||""} onChange={e=>setForm({...form,instructions:e.target.value})} placeholder="hal. Inumin kasabay ng pagkain"/>
          </div>

          <div className="form-actions">
            <button className="btn-save" onClick={saveForm}>I-save</button>
            <button className="btn-cancel" onClick={()=>setForm(null)}>Kanselahin</button>
          </div>
        </div>
      )}
      {meds.length===0 ? (
        <div className="empty-state"><Icon name="pill" size={36}/><p>Wala pang gamot na naka-schedule.</p></div>

/* ── SAFE ZONE ───────────────────────────────────────────────────────── */
function SafeZoneMap({ gps, zone }) {
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markerRef = useRef(null);
  const circleRef = useRef(null);
  const zoneMarkerRef = useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if(!mapRef.current || typeof L === "undefined") return;
    const center = gps ? [Number(gps.lat),Number(gps.lng)] : zone ? [zone.lat,zone.lng] : [14.5995,120.9842]; // Manila fallback
    leafletMap.current = L.map(mapRef.current, { zoomControl:true, attributionControl:false }).setView(center, 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(leafletMap.current);
    setReady(true);
    return () => { leafletMap.current && leafletMap.current.remove(); leafletMap.current=null; };
  }, []);

  useEffect(() => {
    if(!ready || !leafletMap.current) return;
    const map = leafletMap.current;

    // Safe zone circle + center marker
    if(zone){
      if(circleRef.current) map.removeLayer(circleRef.current);
      circleRef.current = L.circle([zone.lat,zone.lng], { radius: zone.radiusKm*1000, color:"#1A8C4A", fillColor:"#1A8C4A", fillOpacity:0.12, weight:2 }).addTo(map);
      if(zoneMarkerRef.current) map.removeLayer(zoneMarkerRef.current);
      zoneMarkerRef.current = L.circleMarker([zone.lat,zone.lng], { radius:5, color:"#1A8C4A", fillColor:"#1A8C4A", fillOpacity:1 }).addTo(map).bindTooltip(zone.label||"Safe Zone");
    }
    // Senior's live marker
    if(gps){
      const pos = [Number(gps.lat),Number(gps.lng)];
      if(markerRef.current) map.removeLayer(markerRef.current);
      const icon = L.divIcon({ className:"", html:'<div style="width:18px;height:18px;border-radius:50%;background:#C4301E;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.4);"></div>', iconSize:[18,18], iconAnchor:[9,9] });
      markerRef.current = L.marker(pos, {icon}).addTo(map).bindTooltip("Kasalukuyang lokasyon");
    }
    // Fit bounds to show both if both exist
    if(gps && zone){
      const bounds = L.latLngBounds([[Number(gps.lat),Number(gps.lng)],[zone.lat,zone.lng]]);
      map.fitBounds(bounds.pad(0.4));
    } else if(gps){ map.setView([Number(gps.lat),Number(gps.lng)], 14); }
    else if(zone){ map.setView([zone.lat,zone.lng], 14); }
  }, [ready, gps?.lat, gps?.lng, zone?.lat, zone?.lng, zone?.radiusKm]);

  return <div className="map-frame" ref={mapRef}></div>;
}

/* ── VITAL SPARKLINE CHART (hand-rolled SVG, no external chart library) ── */
function VitalChart({ label, points, unit, color, extractValue }) {
  const vals = points.map(p => extractValue ? extractValue(p.value) : parseFloat(p.value)).filter(v=>!isNaN(v));
  const latestRaw = points.length ? points[points.length-1].value : null;
  if (vals.length < 2) {
    return (
      <div className="vital-chart-card">
        <div className="vital-chart-head"><span className="nm">{label}</span>{latestRaw!==null && <span className="latest" style={{color}}>{latestRaw} {unit}</span>}</div>
        <div className="vital-chart-empty">{points.length===0?"Wala pang na-log":"Kailangan ng 2+ entry para sa chart"}</div>
      </div>
    );
  }
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const W=280, H=56, PAD=5;
  const stepX = vals.length>1 ? (W-PAD*2)/(vals.length-1) : 0;
  const coords = vals.map((v,i)=>[PAD+i*stepX, H-PAD-((v-min)/range)*(H-PAD*2)]);
  const pathD = coords.map(([x,y],i)=>`${i===0?"M":"L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const areaD = `${pathD} L${coords[coords.length-1][0].toFixed(1)},${H} L${coords[0][0].toFixed(1)},${H} Z`;
  return (
    <div className="vital-chart-card">
      <div className="vital-chart-head"><span className="nm">{label}</span><span className="latest" style={{color}}>{latestRaw} {unit}</span></div>
      <svg className="vital-chart-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        <path d={areaD} fill={color} opacity="0.12" stroke="none"/>
        <path className="vc-line" d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {coords.map(([x,y],i)=><circle key={i} cx={x} cy={y} r={i===coords.length-1?3:1.4} fill={color}/>)}
      </svg>
    </div>
  );
}

  "Isang bagay na ikinatuwa ko ngayong linggo...",

function LettersPanel({ household, session }) {
  const [letters, setLetters] = useState(null);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [promptIdx, setPromptIdx] = useState(0);
  const [justSent, setJustSent] = useState(false);

  const load = async () => {
    if(!supa) { setLetters([]); return; }
    const { data } = await supa.from("naknak_letters").select("id,content,author_email,created_at").eq("household_id", household.householdId).order("created_at",{ascending:false});
    setLetters(data||[]);
  };
  useEffect(()=>{ load(); }, [household.householdId]);
  useEffect(()=>{ const id=setInterval(()=>setPromptIdx(i=>(i+1)%NAKS_PROMPTS_DASH.length), 6000); return ()=>clearInterval(id); },[]);

  const send = async () => {
    if(!text.trim() || !supa) return;
    setBusy(true);
    const { error } = await supa.from("naknak_letters").insert({ household_id: household.householdId, author_email: session?.user?.email||"Caregiver", content: text.trim() });
    setBusy(false);
    if(!error){ setText(""); setJustSent(true); setTimeout(()=>setJustSent(false),2000); load(); }
  };
  const del = async (id) => {
    if(!supa) return;
    await supa.from("naknak_letters").delete().eq("id", id);
    load();
  };

  return (
    <>
      <div className="panel" style={{background:"linear-gradient(160deg,var(--card-bg) 0%,var(--cream2) 100%)"}}>

            <Icon name="heart" size={32} color="var(--green)"/>

function CalendarPanel({ senior, patch }) {
  const [view, setView] = useState("month");
  const [cursor, setCursor] = useState(new Date());
  const [modal, setModal] = useState(null); // {date, event?}
  const today = new Date();

  const nav = (dir) => {
    const d = new Date(cursor);
    if(view==="day") d.setDate(d.getDate()+dir);
    else if(view==="week") d.setDate(d.getDate()+dir*7);
    else if(view==="month") d.setMonth(d.getMonth()+dir);
    else d.setFullYear(d.getFullYear()+dir);
    setCursor(d);
  };
  const goToday = () => setCursor(new Date());

  const saveEvent = (data) => {
    if(data.id){
      patch(s=>({...s, events:(s.events||[]).map(e=>e.id===data.id?{...e,...data}:e)}));
    } else {
      patch(s=>({...s, events:[...(s.events||[]), {id:nid(), ...data}]}));
    }
    setModal(null);
  };
  const deleteEvent = (id) => { patch(s=>({...s, events:(s.events||[]).filter(e=>e.id!==id)})); setModal(null); };

  const title = view==="year" ? cursor.getFullYear()
    : view==="month" ? `${MON_TL[cursor.getMonth()]} ${cursor.getFullYear()}`
    : view==="week" ? (()=>{ const s=startOfWeek(cursor), e=addDays(s,6); return `${s.getDate()} ${MON_TL[s.getMonth()].slice(0,3)} – ${e.getDate()} ${MON_TL[e.getMonth()].slice(0,3)}, ${e.getFullYear()}`; })()
    : `${cursor.getDate()} ${MON_TL[cursor.getMonth()]} ${cursor.getFullYear()}`;

  return (
    <div className="panel calendar-panel">
      <div className="panel-head">
        <div><h2><Icon name="clock" size={17}/>Calendar</h2><p>Checkup, dialysis, gamot, at iba pang appointment</p></div>
        <button className="btn-add" onClick={()=>setModal({date:ymd(cursor)})}><Icon name="plus" size={14}/>Event</button>
      </div>

      <div className="cal-toolbar">
        <div className="cal-nav">
          <button onClick={()=>nav(-1)}><Icon name="arrow_left" size={15}/></button>
          <button className="cal-today-btn" onClick={goToday}>Ngayon</button>
          <button onClick={()=>nav(1)}><Icon name="arrow_right" size={15}/></button>
          <div className="cal-title">{title}</div>
        </div>
        <div className="cal-view-switch">
          {[["day","Araw"],["week","Linggo"],["month","Buwan"],["year","Taon"]].map(([v,l])=>(
            <button key={v} className={view===v?"on":""} onClick={()=>setView(v)}>{l}</button>
          ))}
        </div>
      </div>

      <div className="cal-legend">
        {Object.entries(EVENT_TYPES).map(([k,t])=>(
          <div key={k} className="cal-legend-item"><span style={{background:t.color}}></span>{t.label}</div>
        ))}
      </div>

      {view==="month" && <div key="cal-month" className="panel-enter"><CalMonthView senior={senior} cursor={cursor} today={today} onDayClick={(d)=>setModal({date:ymd(d)})} onEventClick={(ev)=>!ev.isMed&&setModal({date:ev.date,event:ev})}/></div>}
      {view==="week"  && <div key="cal-week" className="panel-enter"><CalWeekView  senior={senior} cursor={cursor} today={today} onDayClick={(d)=>setModal({date:ymd(d)})} onEventClick={(ev)=>!ev.isMed&&setModal({date:ev.date,event:ev})}/></div>}
      {view==="day"   && <div key="cal-day" className="panel-enter"><CalDayView   senior={senior} cursor={cursor} today={today} onEventClick={(ev)=>!ev.isMed&&setModal({date:ev.date,event:ev})} onAdd={()=>setModal({date:ymd(cursor)})}/></div>}
      {view==="year"  && <div key="cal-year" className="panel-enter"><CalYearView  senior={senior} cursor={cursor} today={today} onMonthClick={(d)=>{setCursor(d);setView("month");}}/></div>}

      {modal && <CalEventModal initial={modal} onSave={saveEvent} onDelete={deleteEvent} onClose={()=>setModal(null)}/>}
    </div>
  );
}

function CalMonthView({ senior, cursor, today, onDayClick, onEventClick }) {
  const days = monthGrid(cursor.getFullYear(), cursor.getMonth());
  const rangeStart = days[0], rangeEnd = addDays(days[41],1);
  const occ = occurrencesInRange(senior, rangeStart, rangeEnd);
  const byDay = {};
  occ.forEach(o=>{ const k=ymd(o.date); (byDay[k]=byDay[k]||[]).push(o.event); });

  return (
    <div className="month-grid">
      {DOW_TL.map(d=><div key={d} className="month-dow">{d}</div>)}
      {days.map((d,i)=>{
        const inMonth = d.getMonth()===cursor.getMonth();
        const isToday = sameDay(d,today);
        const evs = byDay[ymd(d)]||[];
        return (
          <div key={i} className={"month-cell"+(inMonth?"":" other-month")+(isToday?" today":"")} onClick={()=>onDayClick(d)}>
            <div className="month-cell-num">{d.getDate()}</div>
            <div className="month-cell-events">
              {evs.slice(0,3).map((ev,idx)=>(
                <div key={idx} className="month-event-chip" style={{background:EVENT_TYPES[ev.type]?.bg,color:EVENT_TYPES[ev.type]?.color}}
                  onClick={(e)=>{e.stopPropagation();onEventClick(ev);}}>{ev.title}</div>
              ))}
              {evs.length>3 && <div className="month-more">+{evs.length-3} pa</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CalWeekView({ senior, cursor, today, onDayClick, onEventClick }) {
  const start = startOfWeek(cursor);
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const occ = occurrencesInRange(senior, start, addDays(start,7));
  const byDay = {};
  occ.forEach(o=>{ const k=ymd(o.date); (byDay[k]=byDay[k]||[]).push(o.event); });

  return (
    <div className="week-grid">
      {days.map((d,i)=>{
        const isToday = sameDay(d,today);
        const evs = (byDay[ymd(d)]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
        return (
          <div key={i} className={"week-col"+(isToday?" today":"")}>
            <div className="week-col-head" onClick={()=>onDayClick(d)}>
              <div className="dow">{DOW_TL[d.getDay()]}</div>
              <div className="num">{d.getDate()}</div>
            </div>
            <div className="week-col-body">
              {evs.length===0 && <div className="week-empty">—</div>}
              {evs.map((ev,idx)=>(
                <div key={idx} className="week-event" style={{background:EVENT_TYPES[ev.type]?.bg,color:EVENT_TYPES[ev.type]?.color}} onClick={()=>onEventClick(ev)}>
                  {ev.time && <span className="tm">{ev.time}</span>}{ev.title}
                </div>
              ))}
              <button className="week-add" onClick={()=>onDayClick(d)}><Icon name="plus" size={11}/></button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CalDayView({ senior, cursor, today, onEventClick, onAdd }) {
  const occ = occurrencesInRange(senior, new Date(cursor.setHours(0,0,0,0)), new Date(cursor.setHours(23,59,59,999)));
  const evs = occ.map(o=>o.event).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  return (
    <div className="day-view">
      {evs.length===0 ? (
        <div className="empty-state"><Icon name="clock" size={36}/><p>Walang naka-schedule sa araw na ito.</p><button className="btn-add" style={{marginTop:12}} onClick={onAdd}><Icon name="plus" size={13}/>Magdagdag ng Event</button></div>
      ) : evs.map((ev,idx)=>(
        <div key={idx} className="day-event-card" style={{borderLeftColor:EVENT_TYPES[ev.type]?.color}} onClick={()=>onEventClick(ev)}>
          <div className="day-event-time">{ev.time||"Buong araw"}</div>
          <div className="day-event-body">
            <div className="t1">{ev.title}</div>
            <div className="t2" style={{color:EVENT_TYPES[ev.type]?.color}}>{EVENT_TYPES[ev.type]?.label}{ev.notes?" · "+ev.notes:""}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function CalYearView({ senior, cursor, today, onMonthClick }) {
  const year = cursor.getFullYear();
  const occ = occurrencesInRange(senior, new Date(year,0,1), new Date(year,11,31,23,59,59));
  const daysWithEvents = new Set(occ.map(o=>ymd(o.date)));
  return (
    <div className="year-grid">
      {Array.from({length:12},(_,m)=>{
        const days = monthGrid(year,m);
        return (
          <div key={m} className="year-month">
            <div className="year-month-head" onClick={()=>onMonthClick(new Date(year,m,1))}>{MON_TL[m]}</div>
            <div className="year-mini-grid">
              {days.map((d,i)=>{
                const inMonth = d.getMonth()===m;
                const has = inMonth && daysWithEvents.has(ymd(d));
                const isToday = sameDay(d,today);
                return <div key={i} className={"year-mini-cell"+(inMonth?"":" dim")+(isToday?" today":"")}>{inMonth?d.getDate():""}{has&&<span className="dot"></span>}</div>;
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function DevicesPanel({ household, seniors }) {
  const [devices, setDevices] = useState(null);
  const [code, setCode] = useState(household.pairCode);
  const [busy, setBusy] = useState(false);
  const [revokingId, setRevokingId] = useState(null);
  const [error, setError] = useState("");
  const [copied, setCopied] = useState(false);

  const load = async () => {
    const { data } = await supa.from("naknak_devices").select("id,device_label,senior_id,paired_at,last_seen_at").eq("household_id", household.householdId).order("paired_at",{ascending:false});
    setDevices(data||[]);
  };
  useEffect(()=>{ load(); }, [household.householdId]);

  const regenerate = async () => {
    setBusy(true);
    const { data, error } = await supa.rpc("regenerate_pair_code", { p_household_id: household.householdId });
    setBusy(false);
    if(!error) setCode(data);
  };
  const copy = () => { navigator.clipboard && navigator.clipboard.writeText(code); setCopied(true); setTimeout(()=>setCopied(false),1800); };
  const revokeDevice = async (device) => {
    const seniorName = seniors.find(s=>s.id===device.senior_id)?.name;
    if(!window.confirm(`I-disconnect ang ${device.device_label}${seniorName?` ni ${seniorName}`:""}? Hindi na makakapagpadala ng status ang device na ito.`)) return;
    setRevokingId(device.id); setError("");
    const { data, error: revokeError } = await supa.rpc("revoke_household_device", { p_household_id: household.householdId, p_device_id: device.id });
    setRevokingId(null);
    if(revokeError || data!==true) { setError(revokeError?.message||"Hindi ma-disconnect ang device. Subukan ulit."); return; }
    await load();
  };

  return (
    <>
      <div className="panel">
        <div className="panel-head"><div><h2><Icon name="phone" size={17}/>Family Code</h2><p>Ilagay ito sa NakNak app ng senior, sa Settings → Cloud Sync</p></div></div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontFamily:"var(--font-mono)",fontSize:28,fontWeight:700,letterSpacing:6,color:"var(--accent)",background:"var(--cream2)",borderRadius:14,padding:"14px 22px",flex:1,textAlign:"center"}}>{code}</div>
          <button className="btn-add" onClick={copy}><Icon name="copy" size={14}/>{copied?"Nakopya!":"Kopyahin"}</button>
          <button className="btn-cancel" disabled={busy} onClick={regenerate}>{busy?"…":"Gumawa ng Bago"}</button>
        </div>
        <p style={{fontSize:11.5,color:"var(--ink3)",fontWeight:700,marginTop:12}}>Ang paggawa ng bagong code ay hindi tinatanggal ang mga device na naka-pair na — pinipigilan lang nito ang mga bagong pag-pair gamit ang lumang code.</p>
      </div>
      <div className="panel">
        <div className="panel-head"><h2><Icon name="dashboard" size={17}/>Mga Naka-pair na Device</h2></div>
        {error && <div className="form-error" role="alert">{error}</div>}
        {devices===null ? <div className="empty-state"><div className="loading-spin"></div></div> :
         devices.length===0 ? <div className="empty-state"><Icon name="phone" size={36}/><p>Wala pang naka-pair na telepono.</p></div> :
         devices.map(d=>(
          <div className="row-item" key={d.id}>
            <div className="row-avatar" style={{background:"var(--cream2)",color:"var(--ink2)"}}><Icon name="phone" size={16}/></div>
            <div className="row-body"><div className="t1">{d.device_label}</div><div className="t2">{d.senior_id?`Para kay ${seniors.find(s=>s.id===d.senior_id)?.name||"Senior / PWD"} · `:""}Na-pair {fmtTime(d.paired_at)} · Huling online {fmtTime(d.last_seen_at)}</div></div>
            <button className="id-upload-btn danger" disabled={revokingId===d.id} onClick={()=>revokeDevice(d)}><Icon name="trash" size={13}/>{revokingId===d.id?"Tinatanggal…":"I-disconnect"}</button>
          </div>
        ))}
      </div>
    </>
  );
}

/* ── ID UPLOAD: Senior Citizen ID + PWD ID, stored as base64 ─────────────── */
function IdUploadPanel({ senior, patch }) {
  const seniorIdRef = useRef(null), pwdIdRef = useRef(null);
  const readFile = (file, cb) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => cb(reader.result);
    reader.readAsDataURL(file);
  };
  const setSeniorId = (dataUrl) => patch(s=>({...s, seniorIdImage: dataUrl}));
  const setPwdId = (dataUrl) => patch(s=>({...s, pwdIdImage: dataUrl}));

  const Card = ({ label, hint, image, onUpload, onRemove, inputRef, icon }) => (
    <div className={"id-upload-card"+(image?" has-image":"")}>
      {image ? (
        <img className="id-upload-preview" src={image} alt={label}/>
      ) : (
        <Icon name={icon} size={40} color="var(--ink3)" strokeWidth={1.5}/>
      )}
      <h4>{label}</h4>
      <p>{hint}</p>
      <input ref={inputRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>readFile(e.target.files[0], onUpload)}/>
      <div style={{display:"flex",gap:8,justifyContent:"center"}}>
        <button className="id-upload-btn" onClick={()=>inputRef.current.click()}><Icon name="upload" size={13}/>{image?"Palitan":"Mag-upload"}</button>
        {image && <button className="id-upload-btn danger" onClick={onRemove}><Icon name="trash" size={13}/>Alisin</button>}
      </div>
    </div>
  );

  return (
    <div className="panel">
      <div className="panel-head"><div><h2><Icon name="id_card" size={17}/>ID Upload</h2><p>Naka-imbak nang ligtas, makikita sa Vault ng senior kahit offline</p></div></div>
      <div className="id-upload-grid">
        <Card label="Senior Citizen ID" hint="Larawan ng harap ng ID" image={senior.seniorIdImage} onUpload={setSeniorId} onRemove={()=>setSeniorId(null)} inputRef={seniorIdRef} icon="id_card"/>
        <Card label="PWD ID" hint="Larawan ng harap ng ID" image={senior.pwdIdImage} onUpload={setPwdId} onRemove={()=>setPwdId(null)} inputRef={pwdIdRef} icon="accessible"/>
      </div>
    </div>
  );
}

    (p.allergies||[]).length?`Allergies: ${p.allergies.join(", ")}`:null,
    (p.conditions||[]).length?`Conditions: ${p.conditions.join(", ")}`:null,
    p.doctorName?`Doctor: ${p.doctorName} ${p.doctorNum||""}`:null,
    mainContact?`Emergency Contact: ${mainContact.name} ${mainContact.num}`:null,
  ].filter(Boolean).join("\n");

  useEffect(() => {
    if(!qrRef.current) return;
    qrRef.current.innerHTML = "";
    if(typeof QRCode === "undefined"){ setFailed(true); return; }
    try{ new QRCode(qrRef.current, { text: payload, width: 200, height: 200, colorDark: "#1E0A02", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); }
    catch(e){ setFailed(true); }
  }, [payload]);

  return (
    <div className="panel">
      <div className="panel-head"><div><h2><Icon name="qr" size={17}/>QR Code</h2><p>I-print o i-save — nasa likod ito ng Quick ID card ng senior</p></div></div>
      <div className="qr-wrap">
        {failed ? (
          <div className="empty-state"><Icon name="alert_tri" size={36}/><p>Hindi ma-load ang QR generator. Kailangan ng internet sa unang pag-load.</p></div>
        ) : (
          <div className="qr-frame"><div ref={qrRef}></div></div>
        )}
        <div className="qr-summary">
          <div className="row"><span>Pangalan</span><strong>{senior.name}</strong></div>
          <div className="row"><span>Blood Type</span><strong>{p.bloodType||"—"}</strong></div>
          <div className="row"><span>Allergies</span><strong>{(p.allergies||[]).length?p.allergies.join(", "):"—"}</strong></div>
          <div className="row"><span>Emergency Contact</span><strong>{mainContact?mainContact.name:"—"}</strong></div>
        </div>
      </div>
    </div>
  );
}

/* ── SETTINGS: theme, plan, account ─────────────────────────────────────── */
function SettingsPanel({ theme, plan, session, onDisconnect, household }) {
  const PLAN_LABEL = { free:"Libre", essential:"Kailangan", family:"Pamilya" };
  const PLAN_COLOR = { free:"var(--ink3)", essential:"var(--gold)", family:"var(--green)" };
  const [checkout, setCheckout] = useState(null); // { planId, method:'paymongo'|'gcash' } or null
  const [checkoutError, setCheckoutError] = useState("");
  const [creatingCheckout, setCreatingCheckout] = useState(false);

  const startCheckout = async (planId) => {
    if(!PAYMONGO_CHECKOUT_FN_URL) return;
    setCreatingCheckout(true); setCheckoutError("");
    try {
      if(!session?.access_token) throw new Error("Mag-sign in ulit bago magbayad.");
      const res = await fetch(PAYMONGO_CHECKOUT_FN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA.anonKey,
          "Authorization": `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ household_id: household?.householdId, plan: planId }),
      });
      const data = await res.json();
      if(!res.ok || !data.checkout_url) throw new Error(data.error || "Hindi magawa ang checkout session");
      // PayMongo returns a trusted HTTPS checkout URL from our Edge Function.
      // Keep the new tab isolated so it cannot reach back through window.opener.
      window.open(data.checkout_url, "_blank", "noopener,noreferrer");
      setCheckout({ planId, method:"paymongo" });
    } catch(err) {
      setCheckoutError(err.message || "May problema sa pagbukas ng payment. Subukan ulit.");
    } finally {
      setCreatingCheckout(false);
    }
  };

  return (
    <>
      <div className="panel">
        <div className="panel-head"><h2><Icon name="sun" size={17}/>Display Mode</h2></div>
        <div className="theme-picker">
          <div className={"theme-opt"+(theme.mode==="light"?" on":"")} onClick={()=>theme.setMode("light")}>
            <Icon name="sun" size={22} color={theme.mode==="light"?"var(--accent)":"var(--ink3)"}/><span>Light</span>
          </div>
          <div className={"theme-opt"+(theme.mode==="dark"?" on":"")} onClick={()=>theme.setMode("dark")}>
            <Icon name="moon" size={22} color={theme.mode==="dark"?"var(--accent)":"var(--ink3)"}/><span>Dark</span>
          </div>
          <div className={"theme-opt"+(theme.mode==="auto"?" on":"")} onClick={()=>theme.setMode("auto")}>
            <Icon name="clock" size={22} color={theme.mode==="auto"?"var(--accent)":"var(--ink3)"}/><span>Auto</span>
          </div>
        </div>
        <p style={{fontSize:11.5,color:"var(--ink3)",fontWeight:600,marginTop:12}}>Ang Auto ay sumusunod sa oras — Dark mula 6PM hanggang 6AM, kagaya ng app sa telepono.</p>
      </div>

      <div className="panel">
        <div className="panel-head"><h2><Icon name="user" size={17}/>Account</h2></div>
        <div className="account-row">
          <div className="account-avatar"><Icon name="user" size={20} color="#fff"/></div>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:800,color:"var(--ink)"}}>{session?.user?.email||"Hindi naka-sign in"}</div>
            <div className="plan-badge" style={{background:`${PLAN_COLOR[plan]}18`,color:PLAN_COLOR[plan],marginTop:6}}>
              <Icon name="checkmark" size={11} color={PLAN_COLOR[plan]}/>{PLAN_LABEL[plan]||plan}
            </div>
          </div>
          <button className="btn-cancel" onClick={onDisconnect}>Mag-sign out</button>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><div><h2><Icon name="credit_card" size={17}/>Mga Plano at Bayad</h2><p>I-upgrade o i-downgrade ang plan ng household</p></div></div>
        <div className="settings-price-grid">
          {Object.values(PLANS).map(p=>{
            const isCurrent = p.id===plan;
            const isFree = p.id==="free";
            return (
              <div key={p.id} className={"settings-price-card"+(isCurrent?" current":"")}>
                {isCurrent && <div className="settings-price-badge">Kasalukuyan</div>}
                <div style={{fontFamily:"var(--font-display)",fontSize:16,fontWeight:600,color:"var(--ink)"}}>{p.name}</div>
                <div style={{fontFamily:"var(--font-mono)",fontSize:24,fontWeight:700,color:"var(--ink)",marginTop:6}}>{p.price}<span style={{fontSize:11,color:"var(--ink3)",fontWeight:600}}> {p.priceSub}</span></div>
                <ul style={{listStyle:"none",margin:"14px 0",display:"flex",flexDirection:"column",gap:7}}>
                  {p.features.map((f,i)=>(
                    <li key={i} style={{display:"flex",alignItems:"flex-start",gap:7,fontSize:12,fontWeight:700,color:"var(--ink2)"}}>
                      <Icon name="checkmark" size={13} color="var(--green)" strokeWidth={3}/>{f}
                    </li>
                  ))}
                </ul>
                {isCurrent ? (
                  <div style={{textAlign:"center",fontSize:12,fontWeight:700,color:"var(--ink3)",padding:"10px 0"}}>Ito ang aktibong plano mo</div>
                ) : isFree ? (
                  <a className="btn-cancel" style={{width:"100%",display:"block",textAlign:"center"}} href="mailto:naknak@gmail.com?subject=NakNak%20plan%20downgrade">Humiling ng downgrade</a>
                ) : checkout?.planId===p.id && checkout?.method==="paymongo" ? (
                  <div style={{background:"var(--cream2)",borderRadius:12,padding:"14px",textAlign:"center"}}>
                    <div className="loading-spin" style={{width:22,height:22,marginBottom:10}}></div>
                    <p style={{fontSize:12,fontWeight:600,color:"var(--ink2)",marginBottom:10,lineHeight:1.6}}>Nabuksan ang PayMongo checkout sa bagong tab. Kapag kumpirmado ang bayad, awtomatikong mag-a-activate ang plan mo — hindi mo na kailangang gawin pa.</p>
                    <a href="mailto:naknak@gmail.com?subject=NakNak%20payment%20support" style={{display:"inline-block",color:"var(--accent)",fontSize:11,fontWeight:700,textDecoration:"underline",marginBottom:8}}>Kailangan ng tulong sa bayad?</a>
                    <button className="btn-cancel" style={{width:"100%"}} onClick={()=>setCheckout(null)}>Isara</button>
                  </div>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {checkoutError && <div style={{fontSize:11,fontWeight:600,color:"var(--red)",marginBottom:2}}>{checkoutError}</div>}
                    {PAYMONGO_CHECKOUT_FN_URL && <button className="btn-save" style={{width:"100%"}} disabled={creatingCheckout} onClick={()=>startCheckout(p.id)}>{creatingCheckout?"…":"Bayaran Ngayon"}</button>}
                    <a className={PAYMONGO_CHECKOUT_FN_URL?"btn-cancel":"btn-save"} style={{width:"100%",display:"block",textAlign:"center"}} href={`mailto:naknak@gmail.com?subject=NakNak%20manual%20GCash%20-%20${encodeURIComponent(p.name)}`}>Manual GCash support</a>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <p style={{fontSize:11,color:"var(--ink3)",fontWeight:600,marginTop:16,lineHeight:1.6}}>
          <Icon name="info" size={11} color="var(--ink3)"/> PayMongo upgrades activate only after its signed payment webhook confirms the payment. Manual GCash payments require support verification.
        </p>
      </div>
    </>
  );
}

function ProfilePanel({ senior, patch, draft, setDraft }) {
  const p = senior.medicalProfile||{};
  const [f, setF] = useState(p);
  // name/nickname live in the parent (Dashboard) as `draft`, not local state, so the tab
  // bar and sidebar can mirror keystrokes in real time. null means "not edited this visit".
  const name = draft.name!==null ? draft.name : (senior.name||"");
  const nickname = draft.nickname!==null ? draft.nickname : (senior.nickname||"");
  const setName = (v) => setDraft(d=>({...d, name:v}));
  const setNickname = (v) => setDraft(d=>({...d, nickname:v}));
  const [newAllergy, setNewAllergy] = useState("");
  const [newCond, setNewCond] = useState("");
  const [justSaved, setJustSaved] = useState(false);
  useEffect(()=>{ setF(senior.medicalProfile||{}); }, [senior.id]);
  const dirty = JSON.stringify(f) !== JSON.stringify(p) || name.trim()!==(senior.name||"") || nickname.trim()!==(senior.nickname||"");
  const save = () => { patch(s=>({...s, name:name.trim()||s.name, nickname:nickname.trim(), medicalProfile:f})); setDraft({name:null,nickname:null}); setJustSaved(true); setTimeout(()=>setJustSaved(false),1800); };
  const addAllergy = () => { if(!newAllergy.trim())return; setF({...f,allergies:[...(f.allergies||[]),newAllergy.trim()]}); setNewAllergy(""); };
  const addCond = () => { if(!newCond.trim())return; setF({...f,conditions:[...(f.conditions||[]),newCond.trim()]}); setNewCond(""); };

  const FIELDS = [f.bloodType, f.philhealth, f.doctorName, f.doctorNum, (f.allergies||[]).length>0, (f.conditions||[]).length>0];
  const filled = FIELDS.filter(Boolean).length;

  return (
    <div className="profile-layout">
      <div className="panel">
        <div className="panel-head">
          <div><h2><Icon name="file_text" size={17}/>Medical Profile</h2><p>Makikita ito sa QR code at Quick ID ng senior</p></div>
          <div className="profile-progress">
            <div className="profile-progress-ring" style={{background:`conic-gradient(var(--green) ${filled/6*360}deg, var(--cream2) 0deg)`}}>
              <span>{filled}/6</span>
            </div>
          </div>
        </div>
        <div className="form-row">
          <div className="form-field"><label><Icon name="user" size={12}/> Buong Pangalan</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="hal. Inacay Reyes"/></div>
          <div className="form-field"><label><Icon name="user" size={12}/> Palayaw</label><input value={nickname} onChange={e=>setNickname(e.target.value)} placeholder="hal. Nanay"/></div>
        </div>
        <div className="form-row">
          <div className="form-field"><label><Icon name="droplet" size={12}/> Blood Type</label><select value={f.bloodType||""} onChange={e=>setF({...f,bloodType:e.target.value})}><option value="">Wala pang napipili</option>{["A+","A-","B+","B-","AB+","AB-","O+","O-"].map(b=><option key={b}>{b}</option>)}</select></div>
          <div className="form-field"><label><Icon name="file_text" size={12}/> PhilHealth No.</label><input value={f.philhealth||""} onChange={e=>setF({...f,philhealth:e.target.value})} placeholder="hal. 01-234567890-1"/></div>
        </div>
        <div className="form-row">
          <div className="form-field"><label><Icon name="dashboard" size={12}/> Pangalan ng Doktor</label><input value={f.doctorName||""} onChange={e=>setF({...f,doctorName:e.target.value})} placeholder="hal. Dr. Santos"/></div>
          <div className="form-field"><label><Icon name="phone" size={12}/> Numero ng Doktor</label><input value={f.doctorNum||""} onChange={e=>setF({...f,doctorNum:e.target.value})} placeholder="hal. 0917-123-4567"/></div>
        </div>
        <div className="form-field" style={{marginBottom:14}}>
          <label><Icon name="alert_tri" size={12}/> Allergies</label>
          <div style={{display:"flex",gap:8}}><input value={newAllergy} onChange={e=>setNewAllergy(e.target.value)} placeholder="hal. Penicillin — pindutin ang Enter" onKeyDown={e=>e.key==="Enter"&&addAllergy()}/><button className="btn-add" onClick={addAllergy}><Icon name="plus" size={13}/></button></div>
          <div className="chip-row">
            {(f.allergies||[]).length===0 && <span className="chip-empty">Wala pang naitala na allergy</span>}
            {(f.allergies||[]).map((a,i)=><div className="chip chip-warn" key={i}>{a}<button onClick={()=>setF({...f,allergies:f.allergies.filter((_,ix)=>ix!==i)})}><Icon name="x" size={11}/></button></div>)}
          </div>
        </div>
        <div className="form-field" style={{marginBottom:14}}>
          <label><Icon name="heart_pulse" size={12}/> Mga Kondisyon</label>
          <div style={{display:"flex",gap:8}}><input value={newCond} onChange={e=>setNewCond(e.target.value)} placeholder="hal. Hypertension — pindutin ang Enter" onKeyDown={e=>e.key==="Enter"&&addCond()}/><button className="btn-add" onClick={addCond}><Icon name="plus" size={13}/></button></div>
          <div className="chip-row">
            {(f.conditions||[]).length===0 && <span className="chip-empty">Wala pang naitala na kondisyon</span>}
            {(f.conditions||[]).map((c,i)=><div className="chip chip-gold" key={i}>{c}<button onClick={()=>setF({...f,conditions:f.conditions.filter((_,ix)=>ix!==i)})}><Icon name="x" size={11}/></button></div>)}
          </div>
        </div>
        <div className="form-actions">
          <button className="btn-save" onClick={save} disabled={!dirty&&!justSaved} style={!dirty&&!justSaved?{opacity:0.5,cursor:"default"}:{}}>
            {justSaved ? <span style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="checkmark" size={14}/>Na-save!</span> : dirty ? "I-save ang Profile" : "Walang bagong pagbabago"}
          </button>
        </div>
      </div>

      {/* Live preview — exactly what the senior's Quick ID / QR shows, so this screen connects to something real */}
      <div className="quickid-preview">
        <div className="quickid-preview-label"><Icon name="eye" size={12}/> GANITO ITO SA QUICK ID</div>
        <div className="quickid-card">
          <div className="quickid-card-head">
            <div className="quickid-avatar">{(senior.nickname||senior.name||"?")[0]}</div>
            <div><div className="quickid-name">{senior.name}</div><div className="quickid-sub">NakNak Medical ID</div></div>
          </div>
          <div className="quickid-row"><span>Blood Type</span><strong>{f.bloodType||"—"}</strong></div>
          <div className="quickid-row"><span>PhilHealth</span><strong>{f.philhealth||"—"}</strong></div>
          <div className="quickid-row"><span>Doktor</span><strong>{f.doctorName||"—"}</strong></div>
          <div className="quickid-sect">Allergies</div>
          <div className="quickid-tags">{(f.allergies||[]).length? f.allergies.map((a,i)=><span key={i}>{a}</span>) : <em>wala</em>}</div>
          <div className="quickid-sect">Kondisyon</div>
          <div className="quickid-tags">{(f.conditions||[]).length? f.conditions.map((c,i)=><span key={i}>{c}</span>) : <em>wala</em>}</div>
        </div>
      </div>
    </div>
  );
}

/* ── ROOT ────────────────────────────────────────────────────────────── */
function App() {
  const theme = useTheme();
  if (!supa) {
    // No Supabase configured at all — fall back to the legacy local-only flow
    // so the dashboard is still usable while you're wiring up credentials.
    const [hh, setHh] = useState(loadHH);
    if (!hh) return <Onboard onPaired={()=>setHh(loadHH())}/>;
    return <Dashboard household={hh} onDisconnect={()=>{ saveHH(null); setHh(null); }} theme={theme}/>;
  }
  return (
    <AuthGate>
      {(session) => (
        <HouseholdResolver session={session}>
          {(hh) => (
            <Dashboard household={hh} session={session} onDisconnect={async ()=>{ saveHH(null); await supa.auth.signOut(); }} theme={theme}/>
          )}
        </HouseholdResolver>
      )}
    </AuthGate>
  );
}

class ErrB extends React.Component{
  constructor(p){super(p);this.state={e:null};}
  static getDerivedStateFromError(e){return {e};}
  render(){ if(this.state.e) return <div style={{padding:40,fontFamily:"var(--font-body)"}}>May problema: {String(this.state.e.message||this.state.e)}</div>; return this.props.children; }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrB><App/></ErrB>);
